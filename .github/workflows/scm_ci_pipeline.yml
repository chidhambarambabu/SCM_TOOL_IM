name: SCM CI Pipeline & Verification

on:
  push:
    branches: [ main, develop, 'release/**', 'feature/**', 'bugfix/**' ]
  pull_request:
    branches: [ main, develop ]

jobs:
  scm-audit-and-test:
    name: SCM Automated Build, Test & Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify SCM Directory Structure & Configuration Items (PCA)
        run: |
          echo "=== Executing Physical Configuration Audit (PCA) ==="
          test -f docs/SRS.md || { echo "CI-02 SRS missing"; exit 1; }
          test -f docs/SCM_Plan.md || { echo "CI-03 SCM Plan missing"; exit 1; }
          test -f docs/SystemDesignDocument.md || { echo "CI-04 SDD missing"; exit 1; }
          test -f database/food_waste_db.sql || { echo "CI-05 DB script missing"; exit 1; }
          test -f AI_Model/predict_surplus.py || { echo "CI-07 AI Model missing"; exit 1; }
          test -f frontend/index.html || { echo "CI-08 UI missing"; exit 1; }
          test -f test/test_donation.py || { echo "CI-10 Tests missing"; exit 1; }
          echo "All 13 Configuration Items physically verified!"

      - name: Execute Automated Unit & Regression Tests (FCA)
        run: |
          echo "=== Executing Functional Configuration Audit (FCA) ==="
          python -m unittest test/test_donation.py

      - name: Validate AI Surplus Prediction Model
        run: |
          python AI_Model/predict_surplus.py

      - name: SCM Traceability Report
        run: |
          echo "=== SCM Traceability Summary ==="
          echo "Commit Hash: ${{ github.sha }}"
          echo "Ref: ${{ github.ref }}"
          echo "Actor: ${{ github.actor }}"
          echo "CI/CD Pipeline Status: PASSED (All baselines intact)"
